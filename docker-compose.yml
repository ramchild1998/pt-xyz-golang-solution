
services:
  # Layanan Aplikasi Go
  app:
    build: .
    container_name: pt_xyz_app
    ports:
      - "8080:8080"
    environment:
      # Menggunakan variabel dari file .env
      - DATABASE_DSN=${DATABASE_DSN}
      - GIN_MODE=${GIN_MODE}
      - PORT=${PORT}
    depends_on:
      db:
        condition: service_healthy # Menunggu database siap
    networks:
      - xyz_network

  # Layanan Database MySQL
  db:
    image: mysql:8.0
    container_name: pt_xyz_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      # Menjalankan script SQL saat container pertama kali dibuat
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistensi data database
      - xyz_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xyz_network

volumes:
  xyz_db_data:

networks:
  xyz_network:
    driver: bridge